services:
  pco-agent:
    build: .
    container_name: pco-agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - homelab-net
      - pco-mcp_internal
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  homelab-net:
    external: true
  pco-mcp_internal:
    external: true

volumes:
  uploads:
