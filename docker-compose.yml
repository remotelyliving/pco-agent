services:
  pco-agent:
    build: .
    container_name: pco-agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      pco-mcp-db:
        condition: service_healthy
    networks:
      - internal
      - homelab-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  pco-mcp-db:
    image: postgres:16-alpine
    container_name: pco-mcp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pco_mcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pco -d pco_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    external: true
    name: pco-mcp_pgdata

networks:
  internal:
    driver: bridge
  homelab-net:
    external: true
